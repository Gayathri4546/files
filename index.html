<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
    header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; text-align: center; padding: 70px 20px; }
    header h1 { font-size: 2.5em; margin: 0; }
    header p { font-size: 1.2em; }
    .cta-button { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #ff7e5f; color: white; border-radius: 6px; text-decoration: none; }
    .features { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
    .feature { background: white; padding: 20px; border-radius: 10px; width: 250px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    footer { text-align: center; padding: 15px; background: #333; color: white; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Our Service</h1>
    <p>Start your journey with us today.</p>
    <a href="form.html" class="cta-button">Get Started</a>
  </header>

  <section class="features">
    <div class="feature"><h3>Fast</h3><p>Quick and reliable service.</p></div>
    <div class="feature"><h3>Secure</h3><p>Your data is always safe.</p></div>
    <div class="feature"><h3>Support</h3><p>We’re here 24/7 for you.</p></div>
  </section>

  <footer>
    <p>&copy; 2025 Your Brand. All rights reserved.</p>
  </footer>
</body>
</html>
